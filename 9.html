<!DOCTYPE html>
<html>
<head>
<title>React Components</title>
<!-- React CDN -->
<script
src="https://unpkg.com/react@18/umd/react.development.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script
src="https://unpkg.com/@babel/standalone/babel.min.js"></script><style>
body {
font-family: Arial;
text-align: center;
background: #f0f0f0;
padding: 30px;
}
.card {
background: white;
padding: 20px;
margin: 20px auto;
width: 250px;
border-radius: 10px;
box-shadow: 0 0 10px #ccc;
}
button {
background: blue;
color: white;
padding: 10px 15px;
border: none;
cursor: pointer;
border-radius: 5px;
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;
// Component using props
function Welcome(props) {
return <h2>Welcome, {props.name}!</h2>;
}
// Component using useState
function Counter() {
const [count, setCount] = useState(0);
return (
<div className="card">
<h3>Counter: {count}</h3>
<button onClick={() => setCount(count+1)}>Increase
</button>
</div>
);
}
// Main React component
function App() {
return (
<div>
<h1>React Components Demo</h1>
<Welcome name="Student" />
<Counter />
</div>
);
}
// Display React app
const root = ReactDOM.createRoot(
document.getElementById("root")
);
root.render(<App />);
</script>
</body>
</html>
