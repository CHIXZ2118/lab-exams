<!DOCTYPE html>
<html>
<head>
<title>Product Landing Page</title>
<style>
/* Mobile First */
body {
margin: 0;
font-family: Arial;
text-align: center;
}
header {
background: #333;
color: white;
padding: 15px;
}
nav a {
color: white;
text-decoration: none;
margin: 10px;
}
.hero {
padding: 50px 20px;
background: lightblue;
}
.hero h1 {
font-size: 30px;
}
.hero p {
font-size: 16px;
}
button {
padding: 12px 20px;
background: blue;
color: white;
border: none;
cursor: pointer;
}
.features {
padding: 30px 20px;
}
.cards {
display: grid;
grid-template-columns: 1fr;
gap: 20px;
}
.card {
padding: 20px;
background: #f2f2f2;
}
footer {
background: #333;
color: white;
padding: 15px;
}
/* Tablet */
@media (min-width: 600px) {
.hero h1 {
font-size: 40px;
}
.cards {
grid-template-columns: 1fr 1fr;
}
}
/* Desktop */
@media (min-width: 900px) {
.hero h1 {
font-size: 50px;
}
.cards {
grid-template-columns: 1fr 1fr 1fr;
}
}
</style>
</head>
<body>
<header>
<h2>SmartPhone X</h2>
<nav>
<a href="#home">Home</a>
<a href="#features">Features</a>
<a href="#contact">Contact</a>
</nav>
</header>
<section class="hero" id="home">
<h1>SmartPhone X</h1>
<p>
A powerful smartphone with a great camera
and long battery life.
</p>
<button onclick="buyProduct()">Buy Now</button>
</section>
<section class="features" id="features">
<h2>Features</h2>
<div class="cards">
<div class="card">
<h3>� Great Camera</h3>
<p>Take beautiful photos.</p>
</div>
<div class="card">
<h3>� Long Battery</h3>
<p>Use your phone all day.</p>
</div>
<div class="card">
<h3>⚡ Fast Performance</h3>
<p>Fast and smooth performance.</p>
</div>
</div>
</section>
<footer id="contact">
<p>© 2026 SmartPhone X</p>
</footer>
<script>
function buyProduct() {
alert("Thank you for buying SmartPhone X!");
}
</script>
</body>
</html>
