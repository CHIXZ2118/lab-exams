<!DOCTYPE html>
<html>
<head>
<title>Fetch API Data</title>
<style>
body {
font-family: Arial;
text-align: center;
margin: 30px;
}
button {
padding: 10px 20px;
cursor: pointer;
background: blue;
color: white;
border: none;
}
table {
width: 100%;
margin-top: 20px;
border-collapse: collapse;
}
th, td {
border: 1px solid black;
padding: 10px;
}
th {
background: lightblue;
}
#loading {
color: blue;
}
#error {
color: red;
}
</style>
</head>
<body>
<h2>User Details</h2>
<button id="btn" onclick="fetchData()">Load Data</button><p id="loading" style="display:none;">Loading data...</p><p id="error" style="display:none;"></p>
<table>
<thead> <tr>
<th>ID</th>
<th>Name</th>
<th>Email</th> </tr> </thead>
<tbody id="tableData">
<tr>
<td colspan="3">Click Load Data</td>
</tr> </tbody> </table>
<script>
async function fetchData() {
const loading = document.getElementById("loading");const error = document.getElementById("error");const tableData = document.getElementById("tableData");const btn = document.getElementById("btn");
loading.style.display = "block";
error.style.display = "none";
tableData.innerHTML = "";
btn.disabled = true;
try {
const response = await fetch(
"https://jsonplaceholder.typicode.com/users");if (!response.ok) {
throw new Error("API request failed!");}const data = await response.json();
data.forEach(user => {
const row = document.createElement("tr");row.innerHTML = `
<td>${user.id}</td>
<td></td>
<td></td> `;
row.cells[1].textContent = user.name;row.cells[2].textContent = user.email;tableData.appendChild(row);
});
} catch (err) {
error.textContent =
"Error: Unable to fetch data. Check yourinternetconnection.";
error.style.display = "block";
tableData.innerHTML =
'<tr><td colspan="3">No data available</td></tr>';} finally {
loading.style.display = "none";
btn.disabled = false;
}} </script> </body> </html>
